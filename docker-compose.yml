services:
  postgres:
    image: postgres:16-alpine
    container_name: meditrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meditrack
      POSTGRES_PASSWORD: meditrack_dev_2026
      POSTGRES_DB: meditrack
    ports:
      - '5432:5432'
    volumes:
      - meditrack_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meditrack-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - meditrack_redis:/data

volumes:
  meditrack_pgdata:
  meditrack_redis:
